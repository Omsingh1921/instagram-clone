# ============================================================
# INSTAGRAM CLONE — Docker Compose (Local Development)
# ============================================================
# Spins up MySQL, Redis, and (optionally) Kafka for local dev.
#
# Usage:
#   Start core services (MySQL + Redis only — Kafka disabled):
#     docker compose up -d mysql redis
#
#   Start everything including Kafka:
#     docker compose --profile kafka up -d
#
#   Stop all:
#     docker compose down
#
#   Wipe all volumes (clean slate):
#     docker compose down -v
# ============================================================

services:

  # ---- MySQL 8 -------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: instagram-clone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Root@123}
      MYSQL_DATABASE: ${DB_NAME:-instagram_clone_db}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Root@123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Root@123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - instagram-net

  # ---- Redis 7 (cache + rate limiting + token blacklist) -------------
  redis:
    image: redis:7-alpine
    container_name: instagram-clone-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - instagram-net

  # ---- Zookeeper (Kafka dependency) ----------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: instagram-clone-zookeeper
    profiles: [kafka]
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - instagram-net

  # ---- Kafka (optional — only needed when APP_KAFKA_ENABLED=true) ----
  # Activate with: docker compose --profile kafka up -d
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: instagram-clone-kafka
    profiles: [kafka]
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - instagram-net

  # ---- Kafka UI (optional — handy browser UI for inspecting topics) --
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: instagram-clone-kafka-ui
    profiles: [kafka]
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "9093:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - instagram-net

# ---- Named volumes -----------------------------------------------------
volumes:
  mysql_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:

# ---- Shared network ----------------------------------------------------
networks:
  instagram-net:
    driver: bridge
